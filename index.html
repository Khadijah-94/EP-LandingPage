--font:'Inter','Noto Sans Arabic',system-ui,sans-serif;--r:3px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[dir=rtl]{--font:'Noto Sans Arabic','Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:light}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.7;color:var(--text);background:var(--paper);overflow-x:hidden}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0;letter-spacing:-.01em;color:var(--ink)}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{line-height:1.35;letter-spacing:0}
p{margin:0;max-width:56ch}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent-d);outline-offset:3px;border-radius:4px}
.wrap{width:min(1200px,100% - 40px);margin-inline:auto}
section{padding:88px 0}@media(max-width:700px){section{padding:64px 0}}
h2{font-size:clamp(28px,4.2vw,40px);font-weight:700}
.lead{font-size:18px;color:var(--mute);margin-top:16px}
.eyebrow{font-size:14px;font-weight:600;color:var(--mute);margin-bottom:14px;display:block}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:var(--r);border:2px solid transparent;font:600 17px var(--font);cursor:pointer;text-decoration:none;transition:transform .2s,background .2s,color .2s}
.btn-primary{background:var(--accent);color:var(--ink)}
.btn-primary:hover{background:var(--accent-d);transform:translateY(-2px)}
.btn-ghost{border-color:currentColor;color:inherit;background:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:var(--ink2);transform:translateY(-2px)}
.arr{display:inline-block;transition:transform .2s}.btn:hover .arr{transform:translateX(4px)}
[dir=rtl] .arr{transform:scaleX(-1)}[dir=rtl] .btn:hover .arr{transform:scaleX(-1) translateX(4px)}
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(250,248,245,.98);border-bottom:1px solid var(--line)}

/* hero */
.hero{background:var(--ink);color:#fff;padding:0;overflow:hidden}
.hero-grid{display:grid;gap:0;min-height:600px}
.hero-copy{padding:56px 0 40px;align-self:center}
.hero .eyebrow{color:var(--accent)}
h1{color:#fff;font-size:clamp(38px,5.4vw,64px);font-weight:700;max-width:11ch;line-height:1.05}[dir=rtl] h1{font-size:clamp(34px,4.6vw,54px);max-width:14ch;line-height:1.3}
.hero p.sub{font-size:18px;color:#D6DEE9;margin-top:22px}
.intake{display:inline-block;margin-top:22px;padding:6px 14px;border-inline-start:4px solid var(--accent);background:rgba(255,255,255,.08);font-weight:600;font-size:15px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.hero-visual{position:relative;aspect-ratio:4/5;background:#FBFAF6 var(--hero) 50% 50%/cover no-repeat}
.photo-slot{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:flex-start;padding:14px;font-size:12px;color:rgba(255,255,255,.7)}
.skyline{position:absolute;inset-inline:0;bottom:0;width:100%;height:62%}
.route{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:12px;margin-top:30px;max-width:420px;font-size:14px;font-weight:600;color:#D6DEE9}
.route i{height:2px;background:var(--accent);transform-origin:left;animation:draw 1.4s .3s ease-out both}
[dir=rtl] .route i{transform-origin:right}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(min-width:900px){.hero-grid{grid-template-columns:6fr 5fr;gap:56px}.hero-visual{margin-block:0;box-shadow:-10px 0 0 var(--accent)}[dir=rtl] .hero-visual{box-shadow:10px 0 0 var(--accent)}.hero-copy{padding:80px 40px 80px 0}[dir=rtl] .hero-copy{padding:80px 0 80px 40px}.hero-visual{aspect-ratio:auto;min-height:700px;background-position:50% 40%}}
/* value */
.value-grid{display:grid;gap:36px;margin-top:48px}
.benefit{border-top:3px solid var(--ink);padding-top:20px}
.benefit h3{font-size:24px;margin:0 0 10px}
.benefit svg{width:34px;height:34px;stroke:var(--ink);fill:none;stroke-width:1.6}
.benefit p{color:var(--mute)}
@media(min-width:800px){.value-grid{grid-template-columns:repeat(3,1fr);gap:56px}}
/* pathway */
.path{background:var(--mist)}
.steps{list-style:none;margin:48px 0 0;padding:0;display:grid;gap:0;position:relative}
.step{position:relative;padding-inline-start:56px;padding-bottom:36px}
.step::before{content:"";position:absolute;inset-inline-start:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .n{position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink)}
.step.key .n{background:var(--accent);border-color:var(--accent)}
.step h3{font-size:20px}.step p{color:var(--mute);margin-top:6px}

@media(min-width:900px){.steps{grid-template-columns:repeat(4,1fr);gap:28px}.step{padding:56px 0 0}.step::before{inset-inline-start:32px;inset-inline-end:-28px;width:auto;height:2px;top:15px;bottom:auto;background:linear-gradient(90deg,var(--ink) 50%,var(--line) 50%);background-size:200% 100%;animation:fill 1.6s .2s ease-out both}[dir=rtl] .step::before{background:linear-gradient(270deg,var(--ink) 50%,var(--line) 50%);background-size:200% 100%}
.step .n{top:0}.step:last-child::before{display:none}}
@keyframes fill{from{background-position:100% 0}to{background-position:0 0}}
/* english */
.eng{padding:48px 0;border-block:1px solid var(--line)}
.eng .wrap{display:grid;gap:20px;align-items:center}
.eng h2{font-size:clamp(22px,3vw,28px)}.eng .lead{font-size:16px;margin-top:10px}
@media(min-width:800px){.eng .wrap{grid-template-columns:2fr auto;gap:48px}}
/* who */
.who-list{margin-top:40px;display:grid;gap:0}
.who-item{padding:24px 0;border-top:1px solid var(--line)}
.who-item:last-child{border-bottom:1px solid var(--line)}
.who-item h3{font-size:20px}.who-item p{color:var(--mute);margin-top:6px}
.who .btn{margin-top:32px}
@media(min-width:800px){.who-list{grid-template-columns:repeat(3,1fr);gap:40px}.who-item{border:0;border-top:3px solid var(--accent);padding:18px 0}.who-item:last-child{border-bottom:0}}
/* parents */
.parents{background:var(--ink);color:#fff}
.parents h2{color:#fff}.parents .eyebrow{color:var(--accent)}.parents .lead{color:#D6DEE9}
.pgrid{display:grid;gap:40px}.pphoto{aspect-ratio:4/3;background:#FBFAF6 var(--photo) 50% 62%/cover no-repeat}
.points{display:grid;gap:26px}
.point{padding-inline-start:20px;border-inline-start:3px solid var(--accent)}
.point h3{color:#fff;font-size:19px}.point p{color:#D6DEE9;margin-top:4px}
.parents .btn{margin-top:30px}
@media(min-width:900px){.pgrid{grid-template-columns:1fr 1fr;gap:80px;align-items:center}}
/* form */
.lead-sec{background:var(--paper)}
.fgrid{display:grid;gap:40px}
.reassure{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:14px;color:var(--mute)}
.reassure li{padding-inline-start:28px;position:relative}
.reassure li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:14px;height:2px;background:var(--accent-d)}
form{background:#fff;border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:var(--r);padding:28px 20px}
.f{margin-bottom:20px}
label,legend{display:block;font-weight:600;font-size:14px;margin-bottom:8px;color:var(--ink);padding:0}
fieldset{border:0;margin:0 0 20px;padding:0}
input[type=text],input[type=email],input[type=tel],select{width:100%;min-height:52px;padding:0 14px;border:1.5px solid #9AA3B2;border-radius:var(--r);font:400 16px var(--font);color:var(--text);background:#fff}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-inline-end:36px}
[dir=rtl] select{background-position:20px 22px,14px 22px}
input:focus,select:focus{border-color:var(--ink);outline:3px solid rgba(245,232,26,.6);outline-offset:0}
.invalid{border-color:var(--err)!important}
.err{color:var(--err);font-size:13px;margin-top:6px;display:none}.err.on{display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg label,.opts label{margin:0;font-weight:500;cursor:pointer}
.seg input,.opts input{position:absolute;opacity:0;pointer-events:none}
.seg span,.opts span{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:1.5px solid #9AA3B2;border-radius:var(--r);transition:.15s}
.opts{display:grid;gap:10px}
.seg input:checked+span,.opts input:checked+span{border-color:var(--ink);background:#EEF3F9;font-weight:600;}

input:focus-visible+span{outline:3px solid var(--accent-d);outline-offset:2px}
.phone{display:flex;gap:8px;direction:ltr}
.phone .cc{display:grid;place-items:center;min-width:76px;border:1.5px solid #9AA3B2;border-radius:var(--r);background:var(--mist);font-weight:600}
[dir=rtl] .phone input{text-align:right}
.row2{display:grid;gap:0}
@media(min-width:560px){.row2{grid-template-columns:1fr 1fr;gap:16px}}
.reveal[hidden]{display:none}
.consent{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:14px;cursor:pointer}
.consent input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ink)}
.disc{font-size:13px;color:var(--mute);margin-top:14px}
.submit{width:100%;margin-top:20px}
.spin{width:18px;height:18px;border:3px solid rgba(14,42,71,.3);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;display:none}
.loading .spin{display:block}.loading .arr{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.formerr{background:#FDECEA;color:var(--err);padding:12px 14px;border-radius:var(--r);margin-bottom:18px;font-weight:500;font-size:14px}
.success{text-align:start;padding:20px 0}
.success h3{font-size:26px}.success p{margin-top:14px;color:var(--mute)}
.tick{width:48px;height:48px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin-bottom:18px}
.tick svg{width:26px;stroke:#fff;fill:none;stroke-width:3}
@media(min-width:960px){.fgrid{grid-template-columns:5fr 7fr;gap:72px}form{padding:40px}.fgrid>div:first-child{position:sticky;top:110px;align-self:start}}
/* faq */
.faq-list{margin-top:36px;max-width:820px}
.faq-list details{border-top:1px solid var(--line)}.faq-list details:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:64px;padding:14px 0;font-weight:600;font-size:18px;color:var(--ink)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:26px;font-weight:400;transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 22px;color:var(--mute)}
/* final */
.band{height:clamp(260px,42vw,560px);background:#6f6f6f var(--stairs) 50% 45%/cover no-repeat}.final{background:var(--ink);color:#fff;text-align:center;padding:0}.final .wrap{padding:104px 0}
.final h2{color:#fff;font-size:clamp(30px,5vw,48px);max-width:20ch;margin-inline:auto}
.final .intake{margin:26px 0 30px}
.final .brands{justify-content:center;margin-top:44px}
.final p{margin-inline:auto}
/* footer */
footer{background:#141B2E;color:#B8C4D4;padding:44px 0 110px;font-size:14px}
footer .wrap{display:grid;gap:22px}
footer .links{display:flex;gap:24px;flex-wrap:wrap}footer a{color:#fff}
footer p{max-width:70ch}
.sticky{position:fixed;inset-inline:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(250,248,245,.98);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .3s}
.sticky.show{transform:none}.sticky .btn{width:100%}
@media(min-width:960px){.sticky{display:none}footer{padding-bottom:44px}}
.fade{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.fade{opacity:1;transform:none}}
</style>

// Hero variants for PPC message match: set <section data-variant="..."> or ?v=student|parent|search
const HERO_VARIANTS={student:{en:{heroH:"Your international university journey starts in Riyadh."},ar:{heroH:"رحلتك نحو الجامعة الدولية تبدأ من الرياض."}},
parent:{en:{heroH:"A supported pathway from Riyadh to international university study."},ar:{heroH:"مسار مدروس من الرياض نحو الدراسة الجامعية الدولية."}},
search:{en:{heroH:"International Foundation Year in Riyadh — September 2027"},ar:{heroH:"السنة التأسيسية الدولية في الرياض — سبتمبر 2027"}}};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
window.dataLayer=window.dataLayer||[];
const track=(event,extra={})=>window.dataLayer.push({event,lang:document.documentElement.lang,...extra});
let lang='en';
const hv=new URLSearchParams(location.search).get('v');
function dict(l){const v=HERO_VARIANTS[hv];return {...T[l],...(v?v[l]:{})}}
function setLang(l,fromUser){
  lang=l;const d=dict(l);
  document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  $$('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);
  $$('.arr').forEach(e=>e.textContent='→');
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  $('#phone').placeholder=l==='ar'?'5X XXX XXXX':'5X XXX XXXX';
  $('#ielts').placeholder=l==='ar'?'مثال: 6.0':'e.g. 6.0';
  document.title=l==='ar'?'English Path الرياض × NCUK — السنة التأسيسية الدولية':'English Path Riyadh × NCUK — International Foundation Year (Campaign concept)';
  if(fromUser){track('language_switch',{to:l});$('input[name=pref][value='+l+']').checked=true}
}
$$('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang,true)));
// graduation years
const gy=$('#gradYear');for(let y=2027;y>=2018;y--){const o=new Option(y,y);gy.add(o)}
gy.add(new Option('—','older'));gy.lastChild.textContent=' ≤ 2017';
// CTA tracking + sticky
$$('[data-event]').forEach(e=>{if(e.tagName!=='DETAILS'&&e.tagName!=='BUTTON')e.addEventListener('click',()=>track(e.dataset.event,{label:e.textContent.trim()}))});
$$('details[data-event]').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)track('faq_open',{q:d.querySelector('summary').textContent})}));
const sticky=$('#sticky'),formSec=$('#register'),hero=$('#hero');
new IntersectionObserver(()=>{const hr=hero.getBoundingClientRect(),fr=formSec.getBoundingClientRect();
  sticky.classList.toggle('show',hr.bottom<0&&!(fr.top<innerHeight*.7&&fr.bottom>0))},{threshold:[0,.1,.5,1]}).observe(hero);
addEventListener('scroll',()=>{const hr=hero.getBoundingClientRect(),fr=formSec.getBoundingClientRect();
  sticky.classList.toggle('show',hr.bottom<0&&!(fr.top<innerHeight*.7&&fr.bottom>0))},{passive:true});
// entrance reveal
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2});
$$('.fade').forEach(e=>io.observe(e));
// conditional IELTS
$$('input[name=eng]').forEach(r=>r.addEventListener('change',()=>{$('#ieltsWrap').hidden=r.value!=='ielts'||!r.checked}));
// form
const form=$('#leadForm');let started=false;
form.addEventListener('focusin',()=>{if(!started){started=true;track('form_start')}});
const rules={
 name:v=>v.trim().length>=2,
 phone:v=>/^5\d{8}$/.test(v.replace(/[\s-]/g,'').replace(/^(\+?966)/,'').replace(/^0/,'')),
 email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),
 stage:v=>!!v,gradYear:v=>!!v};
function check(k){const el=form.elements[k];const ok=rules[k](el.value);el.classList.toggle('invalid',!ok);
  const m=$(`[data-err=${k}]`);m.classList.toggle('on',!ok);el.setAttribute('aria-invalid',!ok);return ok}
Object.keys(rules).forEach(k=>{form.elements[k].addEventListener('blur',()=>check(k));form.elements[k].addEventListener('input',()=>{if(form.elements[k].classList.contains('invalid'))check(k)})});
form.addEventListener('submit',e=>{
  e.preventDefault();
  const bad=Object.keys(rules).filter(k=>!check(k));
  const c=$('#consent');const cm=$('[data-err=consent]');cm.classList.toggle('on',!c.checked);if(!c.checked)bad.push('consent');
  $('#formErr').hidden=!bad.length;
  if(bad.length){track('form_error',{fields:bad.join(',')});(form.elements[bad[0]]||c).focus();return}
  const btn=$('#submitBtn');btn.classList.add('loading');btn.disabled=true;
  // PROTOTYPE: replace with fetch() to CRM / Admissions endpoint. Do not log personal data to dataLayer.
  setTimeout(()=>{btn.classList.remove('loading');$('#formBody').hidden=true;const s=$('#success');s.hidden=false;s.focus();s.scrollIntoView({block:'center'})},1200);
});
setLang('en');track('page_view',{variant:hv||'default'});
</script>
